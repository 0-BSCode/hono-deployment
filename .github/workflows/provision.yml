name: Set up Github on Remote

on:
    workflow_dispatch: 

jobs:
    initialize:
        runs-on: ubuntu-latest
        steps:
            - name: Notification
              run: echo "Set up Github on Remote"
            
            - name: Provisioning
              uses: appleboy/ssh-action@v1.2.0
              with:
                host: ${{ secrets.HOST }}
                username: ${{ secrets.USERNAME}}
                password: ${{ secrets.PASSWORD }}
                port: ${{ secrets.PORT }}
                script: |
                    rm -rf ${{ secrets.DOMAIN }}
                    git clone https://github.com/0-BSCode/hono-deployment.git ${{ secrets.DOMAIN }}
                    cd ${{ secrets.DOMAIN }}
                    bun install
                    bun pm2 start "bun run start"
            